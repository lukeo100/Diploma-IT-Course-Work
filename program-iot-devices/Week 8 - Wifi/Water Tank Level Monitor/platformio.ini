; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Target: Waveshare ESP32-S3-Pico on the Waveshare Pico Sensor Kit B

[platformio]
; Keep PlatformIO's working folder (.pio: libraries and build output) at a
; short path. LVGL has deep folders, and inside this repo some paths pass the
; 260 character Windows limit, which shows up as
; "lv_conf_internal.h: No such file or directory".
workspace_dir = C:/pio/tankw8

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

build_flags =
    ; Native USB: make Serial use the USB-C port so prints appear in the monitor
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: use include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include/

lib_deps =
    lvgl/lvgl@^9.6.0
    adafruit/Adafruit SSD1327@^1.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    z3t0/IRremote@^4.4.1
