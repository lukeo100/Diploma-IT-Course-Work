; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Target: Waveshare ESP32-S3-Pico + Waveshare Pico Sensor Kit B
; Assumed chip: ESP32-S3R2 (16 MB quad flash, 2 MB quad PSRAM inside the chip).
; The firmware prints the real flash and PSRAM sizes at boot, so check the
; Serial Monitor on first run. If they do not match, change the values below.

[platformio]
; Keep PlatformIO's working folder (.pio: libraries and build output) at a
; short path. LVGL 9.6 has deep folders and long ../../ include chains, and
; inside this repo some paths pass the 260 character Windows limit, which
; shows up as "lv_conf_internal.h: No such file or directory".
; Measured worst case: 261 chars before, 217 after this change.
workspace_dir = C:/pio/adcw7

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; ---- Memory layout for the ESP32-S3-Pico --------------------------------
; 16 MB flash and the matching partition table (bigger app partitions).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Flash in QIO mode, PSRAM in quad (QSPI) mode. Use qio_opi only for
; octal PSRAM chips (R8 variants), which would also take GPIO33 to 37.
board_build.arduino.memory_type = qio_qspi

; ---- Build flags -----------------------------------------------------------
build_flags =
    ; Native USB: make Serial use the USB-C port so prints appear in the monitor
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Tell the Arduino core that PSRAM is fitted
    -D BOARD_HAS_PSRAM
    ; LVGL: use include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    -I include/

; ---- Libraries ------------------------------------------------------------
lib_deps =
    lvgl/lvgl@^9.6.0
    adafruit/Adafruit SSD1327@^1.0.4
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    z3t0/IRremote@^4.4.1
    bblanchon/ArduinoJson@^7.0.0
