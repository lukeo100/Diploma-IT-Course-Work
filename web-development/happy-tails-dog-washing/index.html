    /* ===== ThemeContext ===== */
    const ThemeContext = createContext();

    function ThemeProvider({ children }) {
      const [theme, setTheme] = useState(function() {
        var stored = localStorage.getItem('theme');
        if (stored) return stored;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(function() {
        var root = document.documentElement;
        if (theme === 'dark') { root.classList.add('dark'); }
        else { root.classList.remove('dark'); }
        localStorage.setItem('theme', theme);
      }, [theme]);

      useEffect(function() {
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function handler(e) {
          if (!localStorage.getItem('theme')) {
            setTheme(e.matches ? 'dark' : 'light');
          }
        }
        mq.addEventListener('change', handler);
        return function() { mq.removeEventListener('change', handler); };
      }, []);

      var toggleTheme = function() { setTheme(function(p) { return p === 'dark' ? 'light' : 'dark'; }); };

      return (
        <ThemeContext.Provider value={{ theme: theme, toggleTheme: toggleTheme }}>
          {children}
        </ThemeContext.Provider>
      );
    }

    function useTheme() { return useContext(ThemeContext); }

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12">
                <h2 className="text-3xl sm:text-4xl font-bold font-display text-gray-900 dark:text-white mb-4">What We Stand For</h2>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-8">
                {aboutValues.map(function(v) {
                  return (
                    <div key={v.title} className="flex gap-4 items-start bg-gray-50 dark:bg-gray-800/50 rounded-2xl p-6">
                      <span className="text-3xl flex-shrink-0">{v.icon}</span>
                      <div>
                        <h3 className="text-lg font-semibold text-gray-900 dark:text-white mb-1">{v.title}</h3>
                        <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">{v.desc}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>

          <section className="py-16 bg-brand-600 text-white">
            <div className="max-w-3xl mx-auto text-center px-4">
              <h2 className="text-3xl sm:text-4xl font-bold font-display mb-4">Let&#x2019;s Make Your Dog&#x2019;s Day</h2>
              <p className="text-brand-100 mb-8">Book a mobile grooming session and see the Happy Tails difference for yourself.</p>
              <Link to="/contact" className="inline-block px-8 py-3 bg-white text-brand-600 font-semibold rounded-full hover:bg-brand-50 transition-colors duration-200 shadow-lg">Get in Touch</Link>
            </div>
          </section>
        </main>
      );
    }

    /* ===== Contact Page ===== */
    function Contact() {
      var bookingState = useState({ name: '', email: '', phone: '', dogName: '', breed: '', service: 'wash', date: '', message: '' });
      var bookingForm = bookingState[0];
      var setBookingForm = bookingState[1];
      var enquiryState = useState({ name: '', email: '', subject: '', message: '' });
      var enquiryForm = enquiryState[0];
      var setEnquiryForm = enquiryState[1];
      var bookingSubmittedState = useState(false);
      var bookingSubmitted = bookingSubmittedState[0];
      var setBookingSubmitted = bookingSubmittedState[1];
      var enquirySubmittedState = useState(false);
      var enquirySubmitted = enquirySubmittedState[0];
      var setEnquirySubmitted = enquirySubmittedState[1];

      function handleBookingChange(e) {
        var updated = {};
        for (var k in bookingForm) { updated[k] = bookingForm[k]; }
        updated[e.target.name] = e.target.value;
        setBookingForm(updated);
      }
      function handleEnquiryChange(e) {
        var updated = {};
        for (var k in enquiryForm) { updated[k] = enquiryForm[k]; }
        updated[e.target.name] = e.target.value;
        setEnquiryForm(updated);
      }
      function handleBookingSubmit(e) {
        e.preventDefault();
        setBookingSubmitted(true);
        setTimeout(function() { setBookingSubmitted(false); }, 4000);
        setBookingForm({ name: '', email: '', phone: '', dogName: '', breed: '', service: 'wash', date: '', message: '' });
      }
      function handleEnquirySubmit(e) {
        e.preventDefault();
        setEnquirySubmitted(true);
        setTimeout(function() { setEnquirySubmitted(false); }, 4000);
        setEnquiryForm({ name: '', email: '', subject: '', message: '' });
      }

      var inputClass = 'w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200 text-sm';

      var contactCards = [
        { icon: (<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>), label: 'Location', value: '123 Groomer Lane, Petville, VIC 3000' },
        { icon: (<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>), label: 'Email', value: 'hello@happytails.com' },
        { icon: (<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>), label: 'Phone', value: '(03) 1234 5678' },
        { icon: (<svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>), label: 'Service Area', value: 'Within 15km of Petville, VIC' },
      ];

      var hours = [
        { day: 'Monday', hours: '8:00 AM - 6:00 PM', open: true },
        { day: 'Tuesday', hours: '8:00 AM - 6:00 PM', open: true },
        { day: 'Wednesday', hours: '8:00 AM - 6:00 PM', open: true },
        { day: 'Thursday', hours: '8:00 AM - 6:00 PM', open: true },
        { day: 'Friday', hours: '8:00 AM - 5:00 PM', open: true },
        { day: 'Saturday', hours: '9:00 AM - 4:00 PM', open: true },
        { day: 'Sunday', hours: 'Closed', open: false },
      ];

      return (
        <main className="pt-16">
          <section className="relative bg-brand-600 py-16 sm:py-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              <span className="text-5xl mb-4 block">&#128222;</span>
              <h1 className="text-4xl sm:text-5xl font-bold text-white font-display mb-4">Contact Us</h1>
              <p className="text-brand-100 text-lg max-w-2xl mx-auto">Ready to book a grooming session or have a question? We&#x2019;d love to hear from you!</p>
            </div>
          </section>

          <section className="py-16 sm:py-20 transition-colors duration-300">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-16">
                {contactCards.map(function(card) {
                  return (
                    <div key={card.label} className="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-md text-center hover:shadow-lg transition-all duration-300">
                      <div className="w-12 h-12 bg-brand-100 dark:bg-brand-900/30 rounded-full flex items-center justify-center mx-auto mb-3 text-brand-600 dark:text-brand-400">{card.icon}</div>
                      <h3 className="text-sm font-semibold text-gray-900 dark:text-white mb-1">{card.label}</h3>
                      <p className="text-sm text-gray-600 dark:text-gray-400">{card.value}</p>
                    </div>
                  );
                })}
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-12">
                <div>
                  <div className="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-md">
                    <h2 className="text-2xl font-bold font-display text-gray-900 dark:text-white mb-2">Request a Grooming Session</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400 mb-6">Fill out the form below and we&#x2019;ll get back to you within 24 hours to confirm your booking.</p>
                    {bookingSubmitted && (
                      <div className="mb-4 p-4 bg-green-100 dark:bg-green-900/30 border border-green-400 dark:border-green-600 text-green-700 dark:text-green-300 rounded-xl text-sm">
                        Thank you! Your grooming request has been submitted. We&#x2019;ll be in touch shortly.
                      </div>
                    )}
                    <form onSubmit={handleBookingSubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input name="name" value={bookingForm.name} onChange={handleBookingChange} className={inputClass} placeholder="Your Name *" required />
                        <input name="email" type="email" value={bookingForm.email} onChange={handleBookingChange} className={inputClass} placeholder="Email Address *" required />
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input name="phone" type="tel" value={bookingForm.phone} onChange={handleBookingChange} className={inputClass} placeholder="Phone Number *" required />
                        <input name="dogName" value={bookingForm.dogName} onChange={handleBookingChange} className={inputClass} placeholder="Dog's Name *" required />
                      </div>
                      <input name="breed" value={bookingForm.breed} onChange={handleBookingChange} className={inputClass} placeholder="Dog Breed" />
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <select name="service" value={bookingForm.service} onChange={handleBookingChange} className={inputClass}>
                          <option value="wash">Full Wash &amp; Dry</option>
                          <option value="haircut">Haircut &amp; Styling</option>
                          <option value="nails">Nail Trimming</option>
                          <option value="full">Full Grooming Package</option>
                        </select>
                        <input name="date" type="date" value={bookingForm.date} onChange={handleBookingChange} className={inputClass} required />
                      </div>
                      <textarea name="message" value={bookingForm.message} onChange={handleBookingChange} className={inputClass} rows="3" placeholder="Additional notes (e.g. allergies, special requests)" />
                      <button type="submit" className="w-full py-3 bg-brand-500 hover:bg-brand-600 text-white font-semibold rounded-xl transition-colors duration-200 shadow-md hover:shadow-lg">Request Booking</button>
                    </form>
                  </div>
                </div>

                <div className="space-y-8">
                  <div className="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-md">
                    <h2 className="text-2xl font-bold font-display text-gray-900 dark:text-white mb-2">General Enquiry</h2>
                    <p className="text-sm text-gray-500 dark:text-gray-400 mb-6">Have a question? Drop us a message and we&#x2019;ll get back to you.</p>
                    {enquirySubmitted && (
                      <div className="mb-4 p-4 bg-green-100 dark:bg-green-900/30 border border-green-400 dark:border-green-600 text-green-700 dark:text-green-300 rounded-xl text-sm">
                        Thank you! Your enquiry has been sent. We&#x2019;ll respond as soon as possible.
                      </div>
                    )}
                    <form onSubmit={handleEnquirySubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <input name="name" value={enquiryForm.name} onChange={handleEnquiryChange} className={inputClass} placeholder="Your Name *" required />
                        <input name="email" type="email" value={enquiryForm.email} onChange={handleEnquiryChange} className={inputClass} placeholder="Email Address *" required />
                      </div>
                      <input name="subject" value={enquiryForm.subject} onChange={handleEnquiryChange} className={inputClass} placeholder="Subject" />
                      <textarea name="message" value={enquiryForm.message} onChange={handleEnquiryChange} className={inputClass} rows="4" placeholder="Your Message *" required />
                      <button type="submit" className="w-full py-3 bg-gray-900 dark:bg-white hover:bg-gray-800 dark:hover:bg-gray-100 text-white dark:text-gray-900 font-semibold rounded-xl transition-colors duration-200 shadow-md hover:shadow-lg">Send Enquiry</button>
                    </form>
                  </div>

                  <div className="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-md">
                    <h2 className="text-2xl font-bold font-display text-gray-900 dark:text-white mb-4">Business Hours</h2>
                    <div className="space-y-3">
                      {hours.map(function(h) {
                        return (
                          <div key={h.day} className="flex items-center justify-between py-2 border-b border-gray-100 dark:border-gray-700 last:border-0">
                            <span className="text-sm font-medium text-gray-900 dark:text-white">{h.day}</span>
                            <div className="flex items-center gap-2">
                              <span className={"w-2 h-2 rounded-full " + (h.open ? 'bg-green-500' : 'bg-red-500')} />
                              <span className={"text-sm " + (h.open ? 'text-gray-600 dark:text-gray-400' : 'text-red-500 font-medium')}>{h.hours}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>

              <div className="mt-16">
                <div className="bg-gray-200 dark:bg-gray-700 rounded-2xl overflow-hidden shadow-md">
                  <div className="h-80 flex items-center justify-center">
                    <div className="text-center">
                      <svg className="w-12 h-12 mx-auto text-gray-400 dark:text-gray-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.5}>
                        <path strokeLinecap="round" strokeLinejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path strokeLinecap="round" strokeLinejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                      </svg>
                      <p className="text-gray-500 dark:text-gray-400 font-medium">Map &mdash; 123 Groomer Lane, Petville, VIC 3000</p>
                      <p className="text-sm text-gray-400 dark:text-gray-500 mt-1">Embed a Google Map here for the live version</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      );
    }

    /* ===== App ===== */
    function ScrollToTop() {
      var loc = useLocation();
      useEffect(function() { window.scrollTo(0, 0); }, [loc.pathname]);
      return null;
    }

    function AppContent() {
      return (
        <div className="min-h-screen flex flex-col bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">
          <Navbar />
          <ScrollToTop />
          <div className="flex-1">
            <Routes>
              <Route path="/" element={<Home />} />
              <Route path="/about" element={<About />} />
              <Route path="/contact" element={<Contact />} />
            </Routes>
          </div>
          <Footer />
        </div>
      );
    }

    function App() {
      return (
        <ThemeProvider>
          <HashRouter>
            <AppContent />
          </HashRouter>
        </ThemeProvider>
      );
    }

    /* ===== Render ===== */
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
