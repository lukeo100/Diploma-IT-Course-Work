<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity 1 - Change Background Colour</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="pageBody">
    <div class="container">
      <h1>Activity 1</h1>
      <p>Click the button below to change the background colour!</p>
      <label for="colourPicker">Choose a colour:</label>
      <input id="colour" type="color" />
      <label for="textColour">Choose text colour:</label>
      <input id="textColour" type="color" />
      <button id="changeColourBtn" onclick="changeColour()">
        Change Colour
      </button>
      <p id="colourResult"></p>
      <button onclick="resetColour()">Reset Colour</button>
    </div>

    <script src="main.js"></script>
    <script src="activity.js"></script>
  </body>
</html>
