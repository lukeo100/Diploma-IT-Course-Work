<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipes — Search</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="site-header">
      <h1>🍳 Recipe Finder</h1>
      <p>Search recipes from DummyJSON</p>
    </header>

    <main class="container">
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Try pizza, chicken, pasta..."
        />
        <button id="searchButton">Search</button>
        <button class="button" onclick="clearResults()">Clear</button>
      </div>

      <p id="status" class="status">Type a food and click Search</p>

      <div id="recipeList" class="grid">
        <!-- Results will be inserted here by JavaScript -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
